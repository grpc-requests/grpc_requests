name: Tests

on:
    pull_request:
        branches:
            - develop
            - master

jobs:
    run_checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python 3.9
              uses: actions/setup-python@v5
              with:
                  python-version: 3.9
            - name: Install dependencies
              run: |
                  pip install -r requirements-lint.txt
            - name: Lint and check formatting with ruff
              run: |
                  ruff check src/ --statistics --config ruff.toml
                  ruff format src/ --check --config ruff.toml
            - name: Typecheck with mypy
              run: |
                  mypy src/grpc_requests/*.py
    run_tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
                protobuf-version: ["5.29.5", "6.30.2", "6.31.1"]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .
                  pip install -r requirements-test.txt
                  pip install protobuf==${{ matrix.protobuf-version }}
                  if [ "${{ matrix.protobuf-version }}" = "5.29.5" ]; then
                    pip install grpcio==1.71.0
                    pip install grpcio-reflection==1.71.0
                  else if [ "${{ matrix.protobuf-version }}" = "6.30.2" ]; then
                    pip install grpcio==1.72.1
                    pip install grpcio-reflection==1.72.1
                  else
                    pip install grpcio==1.73.1
                    pip install grpcio-reflection==1.73.1
                  fi
            - name: Test with pytest
              run: |
                  pytest --cov-report=xml --cov=src/grpc_requests
